[apt]
# Comma-separated lists of official repository hosts.
# Values are normalized to lowercase and appended to built-ins unless you use
# the *_override keys.
official_hosts_common = mirrors.example.org

# Per-distro additions
# official_hosts_ubuntu = archive.ubuntu.com, security.ubuntu.com
# official_hosts_debian = deb.debian.org, security.debian.org

# Use *_override to replace built-ins entirely.
# official_hosts_ubuntu_override = archive.ubuntu.com, security.ubuntu.com
# official_hosts_debian_override = deb.debian.org, security.debian.org
