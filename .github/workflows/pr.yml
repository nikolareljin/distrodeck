name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gate:
    uses: nikolareljin/ci-helpers/.github/workflows/ci.yml@production
    with:
      python_version: "3.12"
      # The suite needs the script-helpers submodule (the reusable checkout does
      # not fetch submodules) and pytest, which this repo does not vendor.
      test_command: >-
        git submodule update --init --depth 1 scripts/script-helpers &&
        python3 -m pip install --quiet --disable-pip-version-check pytest &&
        python3 -m pytest tests -q &&
        bash tests/test_install_tools_args.sh &&
        bash tests/test_packaging_metadata.sh
      build_command: "python3 -m py_compile distrodeck.py"

  # macOS smoke: the installer re-execs under Homebrew bash 5 and must list,
  # validate and install with brew. Kept small: macOS minutes are billed 10x.
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    concurrency:
      group: macos-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Homebrew bash 5 first on PATH
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Re-exec from the system bash 3.2
        run: /bin/bash scripts/install-tools-tui.sh --list-categories
      - name: Catalog listing
        run: |
          scripts/install-tools-tui.sh --list-catalog --format tsv > catalog.tsv
          awk -F'\t' 'NF != 6 { bad = 1 } END { exit bad }' catalog.tsv
          wc -l catalog.tsv
      - name: Installer argument tests
        run: bash tests/test_install_tools_args.sh
      - name: Real install through brew
        run: |
          brew uninstall --ignore-dependencies jq || true
          scripts/install-tools-tui.sh --tools jq
          command -v jq
