name: Main
on:
  push:
    branches: [ main ]

jobs:
  auto_tag:
    permissions:
      contents: write
      pull-requests: read
    uses: nikolareljin/ci-helpers/.github/workflows/auto-tag.yml@production
    with:
      update_production_tag: false

  release:
    needs: auto_tag
    if: ${{ needs.auto_tag.outputs.version != '' }}
    permissions:
      contents: write
    uses: nikolareljin/ci-helpers/.github/workflows/create-github-release.yml@production
    with:
      release_tag: ${{ needs.auto_tag.outputs.version }}

  deb:
    # deb-build@production declares `permissions: contents: write` to upload
    # the built .deb to GitHub Releases. A called reusable workflow cannot be
    # granted more permission than the caller, and this repo's default workflow
    # token is read-only, so without this grant the run is rejected at startup
    # (startup_failure). Scoped to this job only (least privilege) since the
    # other jobs' reusable workflows don't request write.
    permissions:
      contents: write
    uses: nikolareljin/ci-helpers/.github/workflows/deb-build.yml@production
    with:
      working_directory: "."
      prebuild_command: "./tools/ci-prebuild.sh"
      build_command: >-
        dpkg-buildpackage -us -uc && mkdir -p dist && cp ../*.deb dist/
      artifact_glob: "dist/*.deb"

  ppa:
    if: ${{ vars.PPA_PUBLISH_ENABLED == 'true' }}
    uses: nikolareljin/ci-helpers/.github/workflows/ppa-deb.yml@production
    with:
      working_directory: "."
      prebuild_command: "./tools/ci-prebuild.sh"
      ppa_target: "ppa:your-launchpad-id/distrodeck"
      deb_fullname: "Nikola Reljin"
      deb_email: "nikola.reljin@gmail.com"
      signing_key_id: ${{ vars.PPA_GPG_KEY_ID }}
    secrets:
      gpg_private_key: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
      gpg_passphrase: ${{ secrets.PPA_GPG_PASSPHRASE }}
      launchpad_ssh_private_key: ${{ secrets.PPA_SSH_PRIVATE_KEY }}

  rpm:
    uses: nikolareljin/ci-helpers/.github/workflows/rpm-build.yml@production
    with:
      working_directory: "${{ github.workspace }}"
      prebuild_command: "./tools/ci-prebuild.sh"
      spec_path: "packaging/distrodeck.spec"
      artifact_glob: "dist/*.rpm"

  brew:
    uses: nikolareljin/ci-helpers/.github/workflows/homebrew-package.yml@production
    with:
      working_directory: "."
      prebuild_command: "./tools/ci-prebuild.sh"
      name: "distrodeck"
      desc: "Export and restore packages before distro upgrades"
      homepage: "https://github.com/nikolareljin/distrodeck"
      deps: "python@3.12"
      man_path: "docs/man/distrodeck.1"
      release_repo: "nikolareljin/distrodeck"
      exclude_paths: ".git,.github,dist,.venv,__pycache__"
      publish: ${{ vars.HOMEBREW_PUBLISH_ENABLED }}
      tap_repo: ${{ vars.HOMEBREW_TAP_REPO }}
      tap_branch: ${{ vars.HOMEBREW_TAP_BRANCH }}
    secrets:
      tap_token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
